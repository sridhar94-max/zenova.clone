<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .form{
            background-color: rgb(132, 186, 225);
            
        }
        .a{
            color: rgb(148, 92, 199);
        }
        .input{
            background-color: rgb(248, 249, 250);
        
        }
        .button{
            background-color: rgba(141, 5, 25, 0.945);
            color: white;
        }
        .button:hover{
            background-color: rgb(20, 149, 20);
        }
    </style>
</head>
<body>
     <form style="width:50%" class="form">
    <fieldset>
        <legend class="a">login form</legend>
        <input type="email" id="email" placeholder="Enter your email" name="email" class="input"><br>
        <br>
        <input type="password" id="password" placeholder="Enter your password" name="password" class="input"><br>
        <br>
        <input type="submit" value="login" class="button">
        <input type="reset" value="reset" class="button">
    </fieldset>
    </form>
</body>
</html>

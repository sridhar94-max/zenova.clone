<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
        .a{
             background-color: rgb(4, 5, 78);
            height: 100px;
            width: 100px;
            transition:width 2s, height 4s, background-color 2s ease 3s;
            color: white;
            
        }
        .b{
            background-color: rgb(116, 118, 232);
            height: 100px;
            width: 100px;
            color: white;
            transition: width 3s;
            
        }
        .Box{
            background-color: rgb(117, 179, 227);
            height: 100px;
            width: 100px;
            color: white;
            color: white;
        }
        .a:hover,.b:hover{
            background-color: rgba(9, 127, 151, 0.734);
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="Box">Box 1</div>
     <div class="a">Box 2</div>
      <div class="Box">Box 3</div>
       <div class="b">Box 4</div>
</body>
</html>

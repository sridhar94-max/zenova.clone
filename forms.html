<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(106, 161, 185); color: rgb(173, 93, 31);">
    <form style="width:50%">
    <fieldset>
        <legend>User Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" name="name"><br>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" name="email"><br>
        <br>
        <label for="tel">Telephone:</label>
        <input type="tel" id="tel" placeholder="Enter your telephone number" name="tel"><br>
        <br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br>
        <br>
        <label for="date of birth" >Date of Birth:</label>
        <input type="date" id="date of birth" ><br>
        <br>
        <p>what social media platforms are you active in?</p>
        <input type="checkbox" id="facebook" name="social media" value="facebook">
        <label for="facebook">Facebook</label><br>
        <input type="checkbox" id="twitter" name="social media" value="twitter">
        <label for="twitter">Twitter</label><br>
        <input type="checkbox" id="instagram" name="social media" value="instagram">
        <label for="instagram">Instagram</label><br>
        <br>
        <input type="submit" value="Submit">
    </fieldset>
    </form>
</body>
</html>

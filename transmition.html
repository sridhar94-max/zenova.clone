<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .a{
           transform: rotate(4s);
            transition:width 2s, height 4s, background-color 2s ease 3s;
            color: white;
            
        }
    </style>
</head>
<body>
    <div class="a">🚗</div>
    
</body>
</html>

<head>

        </tr>

        </tr>
        <tr>
           <td>04</td>
           <td>05</td>
           <td>06</td>
        </tr>
        <tr>
           <th rowspan="3">07</th>
           <th colspan="2" align="center">08</th>
           
        </tr>
        <tr>
           <th rowspan="2">09</th>
           <td>10</td>
        </tr>
        <tr>
           <td>11</td>
        </tr>
       
    </table>
    
</body>
</html>
